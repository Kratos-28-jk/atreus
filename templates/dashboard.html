<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC3200 Power Monitor Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
        }
        
        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-2px);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600;
        }
        
        .metric-card {
            text-align: center;
            padding: 20px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .metric-label {
            color: #6c757d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-connected {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }
        
        .status-disconnected {
            background-color: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }
        
        .btn-custom {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        
        .alert-custom {
            border-radius: 10px;
            border: none;
        }
        
        .table-custom {
            border-radius: 10px;
            overflow: hidden;
        }
        
        .refresh-time {
            font-size: 0.8rem;
            color: #6c757d;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-bolt me-2"></i>PAC3200 Power Monitor
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <span id="connectionStatus" class="status-indicator status-disconnected"></span>
                    <span id="connectionText">Disconnected</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Control Panel -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-cogs me-2"></i>Control Panel
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <button id="collectDataBtn" class="btn btn-success btn-custom w-100">
                                    <i class="fas fa-download me-2"></i>Collect Data
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="refreshBtn" class="btn btn-primary btn-custom w-100">
                                    <i class="fas fa-sync-alt me-2"></i>Refresh
                                </button>
                            </div>
                            <div class="col-md-3">
                                <select id="timeRange" class="form-select">
                                    <option value="1">Last Hour</option>
                                    <option value="6">Last 6 Hours</option>
                                    <option value="24" selected>Last 24 Hours</option>
                                    <option value="168">Last Week</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="autoRefresh">
                                    <label class="form-check-label" for="autoRefresh">
                                        Auto-refresh (30s)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="row mb-4">
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="voltage1">--</div>
                    <div class="metric-label">V1-N (V)</div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="voltage2">--</div>
                    <div class="metric-label">V2-N (V)</div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="voltage3">--</div>
                    <div class="metric-label">V3-N (V)</div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="current1">--</div>
                    <div class="metric-label">L1 (A)</div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="power">--</div>
                    <div class="metric-label">Power (W)</div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card metric-card">
                    <div class="metric-value" id="frequency">--</div>
                    <div class="metric-label">Freq (Hz)</div>
                </div>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line me-2"></i>Voltage Trends
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="voltageChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line me-2"></i>Current Trends
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="currentChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line me-2"></i>Power Trends
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="powerChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line me-2"></i>Power Factor & Frequency
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="pfFreqChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics and Latest Data -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-bar me-2"></i>Statistics
                    </div>
                    <div class="card-body">
                        <div id="statisticsContent">
                            <div class="loading">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-table me-2"></i>Latest Readings
                    </div>
                    <div class="card-body">
                        <div id="latestDataContent">
                            <div class="loading">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alertsContainer"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: none;">
        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div class="text-center">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div>Processing...</div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Global variables
        let charts = {};
        let autoRefreshInterval;
        let lastUpdateTime = new Date();

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initializeDashboard();
            setupEventListeners();
            loadInitialData();
        });

        function initializeDashboard() {
            // Initialize charts
            initializeCharts();
            
            // Check connection status
            checkConnectionStatus();
            
            // Set up auto-refresh
            setupAutoRefresh();
        }

        function setupEventListeners() {
            // Collect data button
            document.getElementById('collectDataBtn').addEventListener('click', collectData);
            
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', refreshData);
            
            // Time range selector
            document.getElementById('timeRange').addEventListener('change', function() {
                loadHistoricalData();
            });
            
            // Auto-refresh toggle
            document.getElementById('autoRefresh').addEventListener('change', function() {
                if (this.checked) {
                    setupAutoRefresh();
                } else {
                    clearInterval(autoRefreshInterval);
                }
            });
        }

        function initializeCharts() {
            // Voltage Chart
            const voltageCtx = document.getElementById('voltageChart').getContext('2d');
            charts.voltage = new Chart(voltageCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'V1-N', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', tension: 0.4 },
                        { label: 'V2-N', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', tension: 0.4 },
                        { label: 'V3-N', data: [], borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: false } }
                }
            });

            // Current Chart
            const currentCtx = document.getElementById('currentChart').getContext('2d');
            charts.current = new Chart(currentCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'L1', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', tension: 0.4 },
                        { label: 'L2', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', tension: 0.4 },
                        { label: 'L3', data: [], borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: false } }
                }
            });

            // Power Chart
            const powerCtx = document.getElementById('powerChart').getContext('2d');
            charts.power = new Chart(powerCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Active Power', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', tension: 0.4 },
                        { label: 'Reactive Power', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', tension: 0.4 },
                        { label: 'Apparent Power', data: [], borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: false } }
                }
            });

            // Power Factor & Frequency Chart
            const pfFreqCtx = document.getElementById('pfFreqChart').getContext('2d');
            charts.pfFreq = new Chart(pfFreqCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Power Factor', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.1)', tension: 0.4, yAxisID: 'y' },
                        { label: 'Frequency', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', tension: 0.4, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', beginAtZero: false },
                        y1: { type: 'linear', display: true, position: 'right', beginAtZero: false, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        function loadInitialData() {
            loadLatestData();
            loadHistoricalData();
            loadStatistics();
        }

        async function loadLatestData() {
            try {
                const response = await fetch('/api/latest_data');
                const result = await response.json();
                
                if (result.success) {
                    updateMetrics(result.data);
                    updateConnectionStatus(result.connection_status);
                    lastUpdateTime = new Date();
                } else {
                    showAlert('warning', result.message);
                }
            } catch (error) {
                showAlert('danger', 'Failed to load latest data: ' + error.message);
            }
        }

        async function loadHistoricalData() {
            const hours = document.getElementById('timeRange').value;
            
            try {
                const response = await fetch(`/api/historical_data?hours=${hours}`);
                const result = await response.json();
                
                if (result.success) {
                    updateCharts(result.data);
                } else {
                    showAlert('warning', result.message);
                }
            } catch (error) {
                showAlert('danger', 'Failed to load historical data: ' + error.message);
            }
        }

        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const result = await response.json();
                
                if (result.success) {
                    updateStatistics(result.statistics);
                } else {
                    showAlert('warning', result.message);
                }
            } catch (error) {
                showAlert('danger', 'Failed to load statistics: ' + error.message);
            }
        }

        function updateMetrics(data) {
            // Update key metrics
            document.getElementById('voltage1').textContent = data.V1_N_Voltage ? data.V1_N_Voltage.toFixed(1) : '--';
            document.getElementById('voltage2').textContent = data.V2_N_Voltage ? data.V2_N_Voltage.toFixed(1) : '--';
            document.getElementById('voltage3').textContent = data.V3_N_Voltage ? data.V3_N_Voltage.toFixed(1) : '--';
            document.getElementById('current1').textContent = data.L1_Current ? data.L1_Current.toFixed(2) : '--';
            document.getElementById('power').textContent = data.Total_Active_Power ? data.Total_Active_Power.toFixed(0) : '--';
            document.getElementById('frequency').textContent = data.Frequency ? data.Frequency.toFixed(2) : '--';
        }

        function updateCharts(data) {
            if (!data || data.length === 0) return;

            const labels = data.map(item => {
                const date = new Date(item.timestamp);
                return date.toLocaleTimeString();
            });

            // Update Voltage Chart
            charts.voltage.data.labels = labels;
            charts.voltage.data.datasets[0].data = data.map(item => item.V1_N_Voltage || 0);
            charts.voltage.data.datasets[1].data = data.map(item => item.V2_N_Voltage || 0);
            charts.voltage.data.datasets[2].data = data.map(item => item.V3_N_Voltage || 0);
            charts.voltage.update();

            // Update Current Chart
            charts.current.data.labels = labels;
            charts.current.data.datasets[0].data = data.map(item => item.L1_Current || 0);
            charts.current.data.datasets[1].data = data.map(item => item.L2_Current || 0);
            charts.current.data.datasets[2].data = data.map(item => item.L3_Current || 0);
            charts.current.update();

            // Update Power Chart
            charts.power.data.labels = labels;
            charts.power.data.datasets[0].data = data.map(item => item.Total_Active_Power || 0);
            charts.power.data.datasets[1].data = data.map(item => item.Total_Reactive_Power || 0);
            charts.power.data.datasets[2].data = data.map(item => item.Total_Apparent_Power || 0);
            charts.power.update();

            // Update Power Factor & Frequency Chart
            charts.pfFreq.data.labels = labels;
            charts.pfFreq.data.datasets[0].data = data.map(item => item.Total_Power_Factor || 0);
            charts.pfFreq.data.datasets[1].data = data.map(item => item.Frequency || 0);
            charts.pfFreq.update();
        }

        function updateStatistics(stats) {
            const content = `
                <div class="row">
                    <div class="col-6">
                        <strong>Total Records:</strong><br>
                        <span class="text-primary">${stats.total_records || 0}</span>
                    </div>
                    <div class="col-6">
                        <strong>First Reading:</strong><br>
                        <small>${stats.first_reading ? new Date(stats.first_reading).toLocaleString() : 'N/A'}</small>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-6">
                        <strong>Last Reading:</strong><br>
                        <small>${stats.last_reading ? new Date(stats.last_reading).toLocaleString() : 'N/A'}</small>
                    </div>
                    <div class="col-6">
                        <strong>Avg Frequency:</strong><br>
                        <span class="text-success">${stats.avg_frequency || 0} Hz</span>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-4">
                        <strong>Avg V1:</strong><br>
                        <span class="text-info">${stats.avg_v1 || 0} V</span>
                    </div>
                    <div class="col-4">
                        <strong>Avg V2:</strong><br>
                        <span class="text-info">${stats.avg_v2 || 0} V</span>
                    </div>
                    <div class="col-4">
                        <strong>Avg V3:</strong><br>
                        <span class="text-info">${stats.avg_v3 || 0} V</span>
                    </div>
                </div>
            `;
            
            document.getElementById('statisticsContent').innerHTML = content;
        }

        function updateConnectionStatus(connected) {
            const statusIndicator = document.getElementById('connectionStatus');
            const statusText = document.getElementById('connectionText');
            
            if (connected) {
                statusIndicator.className = 'status-indicator status-connected';
                statusText.textContent = 'Connected';
            } else {
                statusIndicator.className = 'status-indicator status-disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        async function checkConnectionStatus() {
            try {
                const response = await fetch('/api/connection_status');
                const result = await response.json();
                
                if (result.success) {
                    updateConnectionStatus(result.connected);
                }
            } catch (error) {
                console.error('Failed to check connection status:', error);
            }
        }

        async function collectData() {
            showLoadingOverlay();
            
            try {
                const response = await fetch('/api/collect_data');
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', result.message);
                    // Refresh data after collection
                    setTimeout(() => {
                        loadLatestData();
                        loadHistoricalData();
                        loadStatistics();
                    }, 1000);
                } else {
                    showAlert('danger', result.message);
                }
            } catch (error) {
                showAlert('danger', 'Failed to collect data: ' + error.message);
            } finally {
                hideLoadingOverlay();
            }
        }

        function refreshData() {
            loadLatestData();
            loadHistoricalData();
            loadStatistics();
            checkConnectionStatus();
        }

        function setupAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            autoRefreshInterval = setInterval(() => {
                if (document.getElementById('autoRefresh').checked) {
                    refreshData();
                }
            }, 30000); // 30 seconds
        }

        function showAlert(type, message) {
            const alertsContainer = document.getElementById('alertsContainer');
            const alertId = 'alert-' + Date.now();
            
            const alertHtml = `
                <div id="${alertId}" class="alert alert-${type} alert-custom alert-dismissible fade show" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : 'exclamation-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            alertsContainer.insertAdjacentHTML('beforeend', alertHtml);
            
            // Auto-remove alert after 5 seconds
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) {
                    alert.remove();
                }
            }, 5000);
        }

        function showLoadingOverlay() {
            document.getElementById('loadingOverlay').style.display = 'block';
        }

        function hideLoadingOverlay() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Update refresh time display
        setInterval(() => {
            const timeSinceUpdate = Math.floor((new Date() - lastUpdateTime) / 1000);
            if (timeSinceUpdate < 60) {
                document.querySelector('.refresh-time').textContent = `Last updated: ${timeSinceUpdate}s ago`;
            } else {
                document.querySelector('.refresh-time').textContent = `Last updated: ${Math.floor(timeSinceUpdate / 60)}m ago`;
            }
        }, 1000);
    </script>
</body>
</html>
